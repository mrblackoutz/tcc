name: tcc-odoo-lab

services:
  db:
    image: postgres:18@sha256:7341002d2b8c7c5bdd7542a671a95b36196c0b5b888daf454ae4fc33ba5346d7
    platform: linux/amd64
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no arquivo .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - lab

  odoo:
    image: tcc-odoo:19.0-a4b8772
    platform: linux/amd64
    restart: "no"
    build:
      context: .
      dockerfile: odoo/Dockerfile
      args:
        PYTHON_BASE_IMAGE: python:3.12-slim-bookworm@sha256:4427763a1ba36f5aa8f656a03e5d00f3b8d61f5dd950c73df6c14f8c7640f8ab
        ODOO_REPOSITORY: https://github.com/odoo/odoo.git
        ODOO_COMMIT: a4b877245c9cb5e3d7152d1593a518170f115ca1
    depends_on:
      db:
        condition: service_healthy
    command:
      - /opt/odoo/odoo-bin
      - -c
      - /etc/odoo/odoo.conf
    ports:
      - "127.0.0.1:${ODOO_HTTP_PORT:-8069}:8069"
    volumes:
      - type: bind
        source: ./.runtime/odoo.conf
        target: /etc/odoo/odoo.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./odoo/addons
        target: /mnt/extra-addons
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./odoo/fixtures
        target: /opt/tcc/fixtures
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.runtime/secrets
        target: /run/tcc-secrets
        read_only: false
        bind:
          create_host_path: false
      - odoo_data:/var/lib/odoo
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8069/web/health', timeout=2).read()
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - lab

  gateway:
    image: tcc-gateway:0.5.0
    platform: linux/amd64
    restart: "no"
    build:
      context: ./gateway
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: python:3.12-slim-bookworm@sha256:4427763a1ba36f5aa8f656a03e5d00f3b8d61f5dd950c73df6c14f8c7640f8ab
    depends_on:
      odoo:
        condition: service_healthy
    environment:
      ODOO_BASE_URL: http://odoo:8069
      ODOO_DATABASE: ${ODOO_DATABASE:?defina ODOO_DATABASE no arquivo .env}
      ODOO_API_TOKEN_FILE: /run/tcc-secrets/odoo_api_key
      TCC_M1_FIXTURE_FILE: /run/tcc-secrets/m1_fixture.json
      TCC_M1_EVIDENCE_FILE: /run/tcc-evidence/m1-smoke.json
      TCC_M2_DOCUMENT_FILE: /run/tcc-documents/m2-benign-001.pdf
      TCC_M2_EVIDENCE_FILE: /run/tcc-evidence/m2-smoke.json
    command:
      - python
      - /opt/tcc/scripts/smoke_test_gateway.py
    volumes:
      - type: bind
        source: ./.runtime/secrets
        target: /run/tcc-secrets
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.runtime/evidence
        target: /run/tcc-evidence
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ./.runtime/documents
        target: /run/tcc-documents
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ./scripts
        target: /opt/tcc/scripts
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - lab
      - llm_control

  llm-client:
    profiles:
      - g3b
    image: tcc-gateway:0.5.0
    platform: linux/amd64
    restart: "no"
    build:
      context: ./gateway
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: python:3.12-slim-bookworm@sha256:4427763a1ba36f5aa8f656a03e5d00f3b8d61f5dd950c73df6c14f8c7640f8ab
    depends_on:
      egress-proxy:
        condition: service_healthy
    environment:
      TCC_LLM_CLIENT_MODE: mock
      TCC_LLM_CLIENT_BIND_HOST: 0.0.0.0
      TCC_LLM_CLIENT_PORT: "8080"
      HTTPS_PROXY: http://egress-proxy:8888
      HTTP_PROXY: http://egress-proxy:8888
      NO_PROXY: 127.0.0.1,localhost
    command:
      - python
      - -m
      - tcc_gateway.llm_client_service
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - llm_control
      - llm_egress

  llm-client-g3c:
    profiles:
      - g3c
    image: tcc-gateway:0.5.0
    platform: linux/amd64
    restart: "no"
    build:
      context: ./gateway
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: python:3.12-slim-bookworm@sha256:4427763a1ba36f5aa8f656a03e5d00f3b8d61f5dd950c73df6c14f8c7640f8ab
    depends_on:
      egress-proxy:
        condition: service_healthy
    environment:
      TCC_LLM_CLIENT_MODE: deepseek-smoke
      TCC_LLM_CLIENT_BIND_HOST: 0.0.0.0
      TCC_LLM_CLIENT_PORT: "8080"
      DEEPSEEK_API_KEY_FILE: /run/tcc-secrets/deepseek_api_key
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_MODEL: deepseek-flash
      DEEPSEEK_TEMPERATURE: "0"
      DEEPSEEK_MAX_OUTPUT_TOKENS: "2048"
      HTTPS_PROXY: http://egress-proxy:8888
      HTTP_PROXY: http://egress-proxy:8888
      NO_PROXY: 127.0.0.1,localhost
    command:
      - python
      - -m
      - tcc_gateway.llm_client_service
    expose:
      - "8080"
    volumes:
      - type: bind
        source: ./.runtime/secrets/deepseek_api_key
        target: /run/tcc-secrets/deepseek_api_key
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          body=json.load(urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2));
          assert body == {'mode':'deepseek-smoke','real_transport':True,'status':'ok'}
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - llm_control
      - llm_egress

  g3c-runner:
    profiles:
      - g3c
    image: tcc-gateway:0.5.0
    platform: linux/amd64
    restart: "no"
    build:
      context: ./gateway
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: python:3.12-slim-bookworm@sha256:4427763a1ba36f5aa8f656a03e5d00f3b8d61f5dd950c73df6c14f8c7640f8ab
    environment:
      TCC_G3C_LLM_CLIENT_URL: http://llm-client-g3c:8080
      TCC_G3C_EVIDENCE_FILE: /run/tcc-evidence/g3c-deepseek-smoke.json
    command:
      - python
      - -m
      - tcc_gateway.g3c_smoke_runner
    volumes:
      - type: bind
        source: ./.runtime/evidence
        target: /run/tcc-evidence
        read_only: false
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - llm_control

  egress-proxy:
    profiles:
      - g3b
      - g3c
    image: tcc-egress-proxy:0.1.0
    platform: linux/amd64
    restart: "no"
    build:
      context: ./infra/egress-proxy
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: python:3.12-slim-bookworm@sha256:4427763a1ba36f5aa8f656a03e5d00f3b8d61f5dd950c73df6c14f8c7640f8ab
    environment:
      TCC_PROXY_BIND_HOST: 0.0.0.0
      TCC_PROXY_PORT: "8888"
    expose:
      - "8888"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import socket;
          connection=socket.create_connection(('127.0.0.1', 8888), timeout=2);
          connection.close()
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - llm_egress
      - proxy_external

networks:
  lab:
    internal: true
  llm_control:
    internal: true
  llm_egress:
    internal: true
  proxy_external:

volumes:
  postgres_data:
  odoo_data:
