[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "tcc-odoo-gateway"
version = "0.1.0"
description = "Cliente minimo para o laboratorio C0 via Odoo JSON-2"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28.1,<0.29",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

