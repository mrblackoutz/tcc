[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "tcc-odoo-gateway"
version = "0.2.0"
description = "Gateway experimental tipado para o laboratorio C0 via Odoo JSON-2"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "pypdf==6.16.2",
]

[project.optional-dependencies]
test = [
    "pytest==8.4.2",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tcc_gateway.schemas" = ["*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
